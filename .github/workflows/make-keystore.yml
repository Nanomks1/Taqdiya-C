name: Create keystore (one time)

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          set -e
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          keytool -genkeypair -storetype PKCS12 -keystore release.keystore \
            -alias pdrfalso -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=PD, O=PD, C=MA" > /dev/null 2>&1
          {
            echo "KEYSTORE_BASE64:"
            base64 -w0 release.keystore
            echo
            echo
            echo "KEYSTORE_PASSWORD:"
            echo "$PASS"
            echo
            echo "KEY_ALIAS:"
            echo "pdrfalso"
            echo
            echo "KEY_PASSWORD:"
            echo "$PASS"
          } > keystore-info.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: keystore-bundle
          path: |
            keystore-info.txt
            release.keystore
          retention-days: 1
          
