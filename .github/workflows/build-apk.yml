name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.github/workflows/make-keystore.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check signing secrets
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; exit 1; fi
          done

      - name: Install and add Android
        run: |
          npm install
          npx cap add android

      - name: Version and icons
        run: |
          n=${{ github.run_number }}
          i=$((n-1))
          VN="$((1 + i/100)).$(((i%100)/10)).$((i%10))"
          echo "VN=$VN" >> "$GITHUB_ENV"
          sed -i "s/versionCode 1/versionCode $n/; s/versionName \"1.0\"/versionName \"$VN\"/" android/app/build.gradle
          pip install pillow
          python3 gen_icons.py

      - name: Build release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          UN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$UN" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "taqdiya-$VN.apk" aligned.apk
          "$BT/apksigner" verify "taqdiya-$VN.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: taqdiya-${{ env.VN }}
          path: taqdiya-*.apk
